<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bucks2Bar registration form demonstration.">
  <title>Register | Bucks2Bar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script defer src="script.js"></script>
</head>
<body class="register-page">
  <div class="container app-shell px-3 px-md-4">
    <header class="register-header d-flex align-items-center justify-content-between py-4">
      <a class="brand-link d-flex align-items-center gap-2" href="index.html" aria-label="Bucks2Bar home">
        <span class="brand-mark" aria-hidden="true">$</span>
        <span class="brand-name">bucks<span>2</span>bar<span>.</span></span>
      </a>
      <a class="register-back" href="index.html">← Back to dashboard</a>
    </header>

    <main class="register-main py-5">
      <div class="register-intro mb-4">
        <p class="register-eyebrow mb-3">A fresh start</p>
        <h1 class="register-title mb-3">Create your account<span>.</span></h1>
        <p class="register-copy mb-0">Get ready for a clearer view of your finances.</p>
      </div>

      <section class="register-card p-4 p-md-5" aria-labelledby="registration-heading">
        <h2 class="h5 fw-bold mb-2" id="registration-heading">Your details</h2>
        <p class="register-copy small mb-4">This is a demo form. No account will be created and no information will be saved.</p>
        <noscript><p class="register-notice">JavaScript is required to use this form.</p></noscript>
        <form id="register-form">
          <fieldset id="register-fields" disabled>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="register-name">Name</label>
                <input class="form-control" id="register-name" name="name" type="text" autocomplete="name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="register-email">Email</label>
                <input class="form-control" id="register-email" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="register-password">Password</label>
                <input class="form-control" id="register-password" name="password" type="password" autocomplete="new-password" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="register-confirm-password">Confirm password</label>
                <input class="form-control" id="register-confirm-password" name="confirm-password" type="password" autocomplete="new-password" aria-describedby="register-message" required>
              </div>
              <div class="col-12">
                <label class="form-label" for="register-address">Address</label>
                <textarea class="form-control" id="register-address" name="address" rows="3" autocomplete="street-address" required></textarea>
              </div>
            </div>
            <div id="register-message" class="register-notice mt-3" role="status" aria-live="polite"></div>
            <button type="submit" class="btn btn-green w-100 py-3 mt-4">Register <span aria-hidden="true">→</span></button>
          </fieldset>
        </form>
      </section>
      <p class="register-footer mt-4 mb-0">Your information stays in this page and is not saved.</p>
    </main>
  </div>
</body>
</html>
