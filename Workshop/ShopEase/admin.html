<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Admin - ShopEase</title>
  <script src="src/theme.js"></script>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="navbar">
    <div class="navbar-brand">🛍️ ShopEase</div>
    <nav class="navbar-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="wishlist.html">Wishlist (<span id="wishlist-count">0</span>)</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
      <a href="admin.html" aria-current="page">Admin</a>
      <button class="theme-toggle" id="theme-toggle" type="button">🌙 Dark mode</button>
    </nav>
  </header>
  <main class="admin-page" id="main-content" tabindex="-1">
    <h1>Product Admin</h1>
    <p>Demo only: changes are saved in this browser. This page has no access control.</p>
    <p id="admin-status" role="status" aria-live="polite">Loading products...</p>
    <div id="admin-content" hidden>
      <div class="admin-table-container">
        <table class="admin-table" aria-label="Manage products">
          <thead><tr><th scope="col">Name</th><th scope="col">Price ($)</th><th scope="col">Stock</th><th scope="col">Category</th><th scope="col">Action</th></tr></thead>
          <tbody id="admin-products"></tbody>
        </table>
      </div>
      <form id="admin-add-form" class="checkout-form">
        <h2>Add Product</h2>
        <label for="admin-name">Name</label>
        <input id="admin-name" required maxlength="100" />
        <label for="admin-price">Price ($)</label>
        <input id="admin-price" type="number" min="0" step="0.01" required />
        <label for="admin-stock">Stock</label>
        <input id="admin-stock" type="number" min="0" step="1" required />
        <label for="admin-category">Category</label>
        <select id="admin-category" required>
          <option value="electronics">Electronics</option>
          <option value="clothing">Clothing</option>
          <option value="books">Books</option>
        </select>
        <button class="btn-primary" id="admin-add-button" type="submit">Add Product</button>
      </form>
    </div>
  </main>
  <div id="app-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="src/app.js"></script>
  <script src="src/wishlist.js"></script>
  <script src="src/api.js"></script>
  <script src="src/admin.js"></script>
</body>
</html>
