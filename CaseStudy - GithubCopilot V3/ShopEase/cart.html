<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - ShopEase</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-brand">🛍️ ShopEase</div>
    <nav class="navbar-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="cart-page">
    <h1>Shopping Cart</h1>
    <div class="cart-layout">
      <div class="cart-items" id="cart-items">
        <!-- Cart items rendered by JS -->
      </div>
      <div class="cart-summary">
        <h2>Order Summary</h2>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="shipping">$0.00</span></div>
        <div class="summary-row"><span>Tax (7%)</span><span id="tax">$0.00</span></div>
        <hr />
        <div class="summary-row total"><span>Total</span><span id="total">$0.00</span></div>
        <button class="btn-primary" id="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        <button class="btn-secondary" onclick="clearCart()">Clear Cart</button>
      </div>
    </div>
  </main>

  <script src="src/cart.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
